# Daily update of the hosted database from ClinicalTrials.gov.
#
# Needs one repository secret: DATABASE_URL — the Supabase *Session pooler* string
# (port 5432). Optional secret DATABASE_CA_CERT enables full certificate checking.
# Runs every day at 00:05 India time (18:35 UTC), on demand from the Actions tab
# or the website's Admin page ("Run workflow" / "Sync now"), and whenever a push
# changes the database migrations or the sync code — so new migrations are applied
# right away, before the new website version (which may need them) goes live.
name: Daily CT.gov sync

on:
  schedule:
    - cron: "35 18 * * *"
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/run-migrations.sh"
      - "sync/**"
      - ".github/workflows/daily-sync.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-download of every trial (instead of the daily update)"
        type: boolean
        default: false
      all_drugs:
        description: "Auto-fill: check EVERY drug profile in ChEMBL and Inxight Drugs now (one-time catch-up, takes up to ~4 hours)"
        type: boolean
        default: false

concurrency:
  group: ctgov-sync
  cancel-in-progress: false

permissions:
  contents: write   # only used by the keep-alive step below

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.all_drugs && 330 || 60 }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
      # Repository variable (Settings > Secrets and variables > Actions > Variables),
      # only to let one full sync remove a large number of trials on purpose.
      SYNC_ALLOW_LARGE_PRUNE: ${{ vars.SYNC_ALLOW_LARGE_PRUNE }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a repository secret named DATABASE_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync/package-lock.json

      - name: Install psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Apply database migrations
        run: |
          # psql: make sure the connection is encrypted even if the URL has no sslmode
          case "$DATABASE_URL" in *sslmode=*) export PSQL_URL="$DATABASE_URL" ;; *\?*) export PSQL_URL="$DATABASE_URL&sslmode=require" ;; *) export PSQL_URL="$DATABASE_URL?sslmode=require" ;; esac
          DATABASE_URL="$PSQL_URL" bash db/run-migrations.sh

      - name: Install sync dependencies
        working-directory: sync
        run: npm ci --no-audit --no-fund

      - name: Sync from ClinicalTrials.gov
        working-directory: sync
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            npm run backfill
            npm run retry
          else
            npm run daily
          fi

      # Automatic drug profiles: fills the BLANK drug-profile fields from the trial data,
      # openFDA, ChEMBL and NCATS Inxight Drugs (hand-entered fields are never changed).
      # Daily: openFDA for every drug that is due, ChEMBL for up to 200 and Inxight for up
      # to 100 drugs (each drug is re-checked every 30 days), stopping after 15 minutes.
      # "Run workflow" with all_drugs ticked checks every drug at once (up to ~4 hours).
      # Optional secret OPENFDA_API_KEY raises openFDA's daily limit. A problem here
      # never fails the daily sync.
      - name: Auto-fill drug profiles
        working-directory: sync
        continue-on-error: true
        timeout-minutes: ${{ inputs.all_drugs && 300 || 20 }}
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          ENRICH_MAX_LOOKUPS: ${{ inputs.all_drugs && '10000' || '200' }}
          ENRICH_MAX_INXIGHT: ${{ inputs.all_drugs && '10000' || '100' }}
          ENRICH_BUDGET_MIN: ${{ inputs.all_drugs && '290' || '15' }}
          # Repository variable: sources to leave out, e.g. "inxight" (see README)
          ENRICH_SKIP_SOURCES: ${{ vars.ENRICH_SKIP_SOURCES }}
        run: npm run enrich-products

      # Fails the job (GitHub emails you) when something is broken: database,
      # migrations, no successful sync for 3 days, no trials, or a drug-profile source
      # (openFDA, ChEMBL, Inxight Drugs) not working for 3 days in a row. Warnings (e.g. records
      # in the dead-letter queue) are shown in the log but don't fail the job.
      - name: Health check
        working-directory: sync
        run: npm run health

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # any commit. Push an empty commit when the last one is 50+ days old.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit is $age day(s) old"
          if [ "$age" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep daily sync schedule active"
            git push
          fi
